<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SmartCustomer Analytics{% endblock %}</title>
    <!-- Fonts, Bootstrap, FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            color: #1e293b;
            padding-top: 80px; /* Evite le chevauchement avec la navbar fixe */
        }

        /* Navbar Style Premium */
        .navbar-custom {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .navbar-custom .navbar-brand {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.01em;
            background: linear-gradient(90deg, #818cf8, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-custom .nav-link {
            color: #94a3b8;
            font-weight: 500;
            padding: 8px 16px !important;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-custom .nav-link:hover {
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.05);
        }

        .navbar-custom .nav-link.active-nav {
            color: #ffffff;
            background: #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        /* Header standardisé pour les sous-pages */
        .page-header-container {
            background: linear-gradient(90deg, #0f172a, #1e293b);
            color: white;
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Cartes de type dashboard */
        .card-pfe {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            transition: all 0.3s ease;
        }

        .card-pfe:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
        }

        footer {
            border-top: 1px solid #e2e8f0;
            color: #64748b;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Barre de Navigation Commune -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">
                <i class="fa-solid fa-chart-pie"></i> SmartCustomer
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-1">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active-nav{% endif %}" href="{% url 'dashboard' %}">
                            <i class="fa-solid fa-chart-line"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'clients' %}active-nav{% endif %}" href="{% url 'clients' %}">
                            <i class="fa-solid fa-users"></i> Clients
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'analyse' %}active-nav{% endif %}" href="{% url 'analyse' %}">
                            <i class="fa-solid fa-brain"></i> Comportements
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'powerbi' %}active-nav{% endif %}" href="{% url 'powerbi' %}">
                            <i class="fa-solid fa-chart-column"></i> Analyses BI
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenu Principal -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Pied de page -->
    <footer class="text-center py-4 mt-5">
        <div class="container">
            <small>&copy; 2026 - SmartCustomer Analytics. Conçu pour le Projet de Fin d'Études (PFE).</small>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
