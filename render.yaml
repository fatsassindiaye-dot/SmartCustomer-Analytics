services:
  - type: web
    name: smartcustomer-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn Analyse_intelligente_des_comportements_clients.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: smartcustomer-db
          property: connectionString

databases:
  - name: smartcustomer-db
    databaseName: smartcustomer
    user: smartcustomer
    plan: free
